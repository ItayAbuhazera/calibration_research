name: geo_cuda11
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.10
  - pip>=23.0
  
  # Scientific computing
  - numpy>=1.24.0
  - scipy>=1.10.0
  - pandas>=2.0.0
  - scikit-learn>=1.2.2
  - joblib>=1.2.0
  
  
  # Deep learning - CUDA 11.x compatible
  - pytorch>=2.1.0
  - pytorch-cuda=11.8  # Changed from 12.1 to 11.8
  - torchvision
  - torchaudio
  - tensorflow-probability>=0.19.0
  - tensorflow-datasets>=4.6.0

  
  # High-performance search
  - faiss-gpu
  
  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  
  # Data processing
  - opencv>=4.7.0
  - pillow>=9.4.0
  - tqdm>=4.65.0
  
  # Development tools
  - ipython
  - jupyter
  - pytest
  - black
  
  # Add pip packages
  - pip:      
      # Vision models
      - timm>=0.9.0
      - transformers>=4.29.0
      
      # Calibration-specific
      - netcal>=1.3.5
      - uncertainty-calibration>=0.1.4
      - uncertainty-toolbox>=0.1.1
      
      # Additional ML tools
      - gpytorch>=1.10.0
      - xgboost>=1.7.5
      - lightgbm>=3.3.5
      - catboost>=1.2.0
      
      # For evaluation
      - scikit-optimize>=0.9.0
      - optuna>=3.2.0
      
      # Audio processing
      - librosa>=0.10.0
      - datasets>=2.12.0
      
      # Add TabPFN
      - tabpfn